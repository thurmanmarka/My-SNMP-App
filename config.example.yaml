# SNMP Network Monitor Configuration

# Web server
server:
  # 127.0.0.1 keeps the app reachable only through MyHomeServicesHub (which
  # enforces login). Use 0.0.0.0 only for local testing.
  bind: "127.0.0.1"
  port: 8082

# MariaDB storage for devices, scans and Linux metrics.
# When disabled, devices go to devices.yaml and metrics to CSV files.
# On first start with the database enabled, devices.yaml is imported.
# Import old CSV metrics once with: ./snmp-app -import-csv metrics
database:
  enabled: true
  host: "127.0.0.1"
  port: 3306
  name: "snmp_db"
  user: "snmp_app"
  password: "CHANGE_ME"
  # Raw 60-second metrics older than this are deleted; hourly rollups are kept
  retention_days: 90

# Network settings
network:
  # Subnets to scan (CIDR notation). The older single "subnet:" key still works.
  subnets:
    - "192.168.86.0/24"
    # - "192.168.1.0/24"
  
  # ICMP ping timeout (seconds)
  ping_timeout: 1
  
  # Number of concurrent ping workers
  ping_workers: 50

# SNMP settings
snmp:
  # SNMP version (1, 2c, or 3)
  version: "2c"
  
  # Community strings to try (in order)
  communities:
    - "public"
    - "private"
  
  # SNMP port
  port: 161
  
  # Timeout for SNMP queries (seconds)
  timeout: 2
  
  # Number of retries
  retries: 1

# OIDs to query for device identification
oids:
  # System description
  sysDescr: ".1.3.6.1.2.1.1.1.0"
  
  # System name
  sysName: ".1.3.6.1.2.1.1.5.0"
  
  # System uptime
  sysUpTime: ".1.3.6.1.2.1.1.3.0"
  
  # System contact
  sysContact: ".1.3.6.1.2.1.1.4.0"
  
  # System location
  sysLocation: ".1.3.6.1.2.1.1.6.0"

# Output settings
output:
  # Path to devices database
  devices_file: "devices.yaml"
  
  # Enable verbose logging
  verbose: true
