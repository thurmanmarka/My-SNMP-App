<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SNMP App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 32px;
            font-weight: bold;
        }

        .devices-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .device-tree {
            margin-top: 20px;
        }

        .subnet-group {
            margin-bottom: 20px;
        }

        .subnet-header {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .subnet-header:hover {
            background: #ebebeb;
        }

        .subnet-header .count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
        }

        .device-list {
            padding-left: 20px;
            margin-top: 10px;
        }

        .device-item {
            background: #fafafa;
            border-left: 3px solid #667eea;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .device-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .device-ip {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .device-hostname {
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .device-description {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .device-meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .device-meta-item {
            background: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🔍 My SNMP App</h1>
            </div>
            <div class="header-right">
                <a href="/" class="back-btn">← Back to Hub</a>
                <button class="btn" onclick="startScan()" id="scanBtn">Scan Network</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Devices</div>
                <div class="stat-value" id="deviceCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Scan</div>
                <div class="stat-value" id="lastScan" style="font-size: 18px;">Never</div>
            </div>
        </div>

        <div class="devices-container">
            <h2 style="margin-bottom: 10px;">Network Devices</h2>
            <div class="loading" id="loading">
                <div id="progressBarContainer" style="width:100%;margin-bottom:10px;display:none;">
                    <div id="progressBar" style="height:18px;background:#667eea;border-radius:8px;width:0%;transition:width 0.2s;"></div>
                    <div id="progressText" style="margin-top:4px;font-size:14px;color:#333;text-align:center;"></div>
                </div>
                <span id="loadingText">Scanning network...</span>
            </div>
            <div id="deviceTableContainer" style="margin-bottom:24px;"></div>
            <div class="device-tree" id="deviceTree"></div>
        </div>
    </div>

        <script>
            var script = document.createElement('script');
            if (window.location.pathname.includes('/snmp')) {
                script.src = 'snmp/static/app.js';
            } else {
                script.src = 'static/app.js';
            }
            document.body.appendChild(script);
        </script>
</body>
</html>
