<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitor — My Home Services Hub</title>
    <style>
        :root {
            --bg: #e7edf4;
            --page-bg: #f5f7fb;
            --panel-bg: #ffffff;
            --panel-border: #d2d7e0;
            --accent: #2563eb;
            --accent-soft: #e0edff;
            --text-main: #1f2933;
            --text-muted: #6b7280;
            --gradient-start: #d9e6ff;
            --gradient-mid1: #e7edf4;
            --gradient-mid2: #dde7f4;
            --gradient-end: #d3e0f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --page-bg: #1e293b;
            --panel-bg: #334155;
            --panel-border: #475569;
            --accent: #3b82f6;
            --accent-soft: #1e3a8a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --gradient-start: #1e293b;
            --gradient-mid1: #0f172a;
            --gradient-mid2: #1e293b;
            --gradient-end: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, var(--gradient-start), var(--gradient-mid1) 40%, var(--gradient-mid2) 70%, var(--gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .page-shell {
            max-width: 1400px;
            width: 100%;
            background: var(--page-bg);
            border-radius: 12px;
            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.16),
                0 0 0 1px rgba(15, 23, 42, 0.03);
            padding: 32px;
            transition: background 0.3s ease;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .back-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px 24px;
            flex: 1;
            min-width: 160px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .stat-value {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-value.small { font-size: 1.1rem; font-weight: 600; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .loading {
            display: none;
            padding: 16px 0;
            color: var(--text-muted);
        }

        .loading.active { display: block; }

        #progressBarContainer {
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        #progressBarTrack {
            width: 100%;
            height: 8px;
            background: var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
        }

        #progressBar {
            height: 100%;
            background: var(--accent);
            border-radius: 8px;
            width: 0%;
            transition: width 0.2s;
        }

        #progressText {
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Table */
        .device-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .device-table thead tr {
            background: var(--bg);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .device-table th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
        }

        .device-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--panel-border);
            color: var(--text-main);
        }

        .device-table tbody tr:last-child td { border-bottom: none; }

        .device-table tbody tr:hover td { background: var(--accent-soft); }

        .ip-cell {
            color: var(--accent);
            font-weight: 700;
        }

        .panel-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: -8px 0 16px;
        }

        /* Devices open their history popup */
        .device-table tbody tr[data-ip],
        .device-item[data-ip] { cursor: pointer; }

        .device-table tbody tr[data-ip]:focus-visible,
        .device-item[data-ip]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .stats-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            vertical-align: middle;
        }

        [data-theme="dark"] .stats-badge { color: var(--text-main); }

        /* Tree */
        .subnet-group { margin-bottom: 16px; }

        .subnet-header {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            color: var(--text-main);
        }

        .subnet-header:hover { background: var(--accent-soft); border-color: var(--accent); }

        .subnet-header .count {
            background: var(--accent);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .device-list { padding-left: 16px; margin-top: 8px; }

        .device-item {
            background: var(--page-bg);
            border: 1px solid var(--panel-border);
            border-left: 3px solid var(--accent);
            padding: 14px 16px;
            margin: 8px 0;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .device-item:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateX(4px);
        }

        .device-ip { font-weight: 700; color: var(--accent); font-size: 1rem; margin-bottom: 4px; }
        .device-hostname { color: var(--text-main); font-size: 0.9rem; margin-bottom: 4px; }
        .device-description { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 6px; }

        .device-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .device-meta-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .empty-state h3 { margin-bottom: 8px; color: var(--text-main); }

        /* Device history charts. Charts get their own surface: the dark panel
           colour is too light for the dark series colours to reach 3:1. */
        .history-panel {
            --chart-bg: #ffffff;
            --ink: #1f2933;
            --ink-2: #4b5563;
            --ink-muted: #6b7280;
            --grid: #eef0f4;
            --axis: #d2d7e0;
            --s1: #2a78d6;
            --s2: #eb6834;
            --s3: #1baf7a;
            --s4: #eda100;
            --s5: #e87ba4;
            --s6: #008300;
        }

        [data-theme="dark"] .history-panel {
            --chart-bg: #0f172a;
            --ink: #f1f5f9;
            --ink-2: #cbd5e1;
            --ink-muted: #94a3b8;
            --grid: #1e293b;
            --axis: #334155;
            --s1: #3987e5;
            --s2: #d95926;
            --s3: #199e70;
            --s4: #c98500;
            --s5: #d55181;
            --s6: #008300;
        }

        /* Device history popup. Padding lives on .dialog-body so a click whose
           target is the dialog itself can only be a click on the backdrop. */
        .history-dialog {
            margin: auto;
            width: min(1200px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            padding: 0;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel-bg);
            color: var(--text-main);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }

        .history-dialog::backdrop { background: rgba(15, 23, 42, 0.55); }

        body:has(.history-dialog[open]) { overflow: hidden; }

        .dialog-body { padding: 24px; }

        .dialog-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .dialog-head .panel-title { margin-bottom: 2px; }
        .dialog-sub { color: var(--text-muted); font-size: 0.85rem; }

        .dialog-close {
            background: var(--page-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dialog-close:hover { border-color: var(--accent); color: var(--accent); }

        .history-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .range-group {
            display: inline-flex;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .range-group button {
            background: var(--page-bg);
            color: var(--text-muted);
            border: none;
            border-right: 1px solid var(--panel-border);
            padding: 7px 12px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .range-group button:last-child { border-right: none; }
        .range-group button:hover { color: var(--text-main); background: var(--accent-soft); }
        .range-group button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

        .history-status { color: var(--text-muted); font-size: 0.85rem; margin-left: auto; }

        /* Live Wi-Fi state above the charts */
        .live-panel { margin-bottom: 16px; }
        .live-panel[hidden], .live-bar[hidden], .live-link[hidden] { display: none; }
        .live-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.85rem; }
        .live-rate { color: var(--text-muted); }
        .live-rate select {
            background: var(--page-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.85rem;
        }
        .live-updated { color: var(--text-muted); }
        .live-bar .live-link { margin-left: auto; }
        .live-table .metric { display: flex; align-items: center; gap: 8px; }
        .live-table .metric .num { min-width: 4.8em; }
        .live-table .metric .num.weak { color: #d03b3b; font-weight: 600; }
        [data-theme="dark"] .live-table .metric .num.weak { color: #f87171; }
        svg.spark { display: block; width: 90px; height: 22px; overflow: visible; }
        svg.spark path { fill: none; stroke: var(--s1); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
        svg.spark path.weak { stroke: #d03b3b; }
        [data-theme="dark"] svg.spark path.weak { stroke: #f87171; }
        .live-section { margin-bottom: 14px; }
        .live-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .live-title span { font-weight: 400; color: var(--text-muted); font-size: 0.8rem; margin-left: 6px; }
        .live-table-wrap { overflow-x: auto; border: 1px solid var(--panel-border); border-radius: 8px; }

        .live-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
        }

        .live-table th {
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg);
            padding: 6px 10px;
            white-space: nowrap;
        }

        .live-table td {
            padding: 6px 10px;
            border-top: 1px solid var(--panel-border);
            white-space: nowrap;
        }

        .live-table td.weak { color: #d03b3b; font-weight: 600; }
        .live-link { display: inline-block; font-size: 0.85rem; color: var(--accent); text-decoration: none; }
        .live-link:hover { text-decoration: underline; }
        [data-theme="dark"] .live-table td.weak { color: #f87171; }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
            gap: 16px;
            transition: opacity 0.2s;
        }

        .chart-grid.refreshing { opacity: 0.55; }

        .chart-card {
            background: var(--chart-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 16px;
            position: relative;
            min-width: 0;
        }

        .chart-card.wide { grid-column: 1 / -1; }

        .chart-title { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
        .chart-sub { font-size: 0.8rem; color: var(--ink-muted); margin: 2px 0 8px; }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 0.8rem;
            color: var(--ink-2);
            margin-bottom: 6px;
        }

        .key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }

        .chart-card svg { display: block; width: 100%; overflow: visible; }
        .chart-card svg:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .chart-card svg text { fill: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .chart-card svg text.direct { fill: var(--ink-2); }

        .chart-empty { color: var(--ink-muted); font-size: 0.9rem; padding: 48px 0; text-align: center; }

        .chart-tip {
            position: absolute;
            pointer-events: none;
            background: var(--chart-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
            padding: 8px 10px;
            font-size: 0.8rem;
            color: var(--ink-2);
            white-space: nowrap;
            z-index: 2;
        }

        .chart-tip .tip-time { color: var(--ink-muted); margin-bottom: 4px; }
        .chart-tip .tip-row { display: flex; align-items: center; gap: 6px; }
        .chart-tip strong { color: var(--ink); font-variant-numeric: tabular-nums; }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
            color: var(--ink-2);
            font-variant-numeric: tabular-nums;
        }

        .chart-table th { text-align: right; font-weight: 600; color: var(--ink-muted); padding: 4px 6px; border-bottom: 1px solid var(--axis); }
        .chart-table td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
        .chart-table th:first-child, .chart-table td:first-child { text-align: left; }
        .chart-table tr.not-charted td { color: var(--ink-muted); }

        @media (max-width: 600px) {
            .chart-grid { grid-template-columns: 1fr; }
            .history-status { margin-left: 0; width: 100%; }
            .history-dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
            .dialog-body { padding: 16px; }
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .page-shell { padding: 20px; }
            h1 { font-size: 1.3rem; }
            .top-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="top-bar">
            <div class="top-bar-left">
                <h1>🔍 Network Monitor</h1>
            </div>
            <div class="top-bar-right">
                <a href="/" class="back-btn">🏠 Home</a>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
                <button class="btn" onclick="startScan()" id="scanBtn">Scan Network</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Devices</div>
                <div class="stat-value" id="deviceCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Scan</div>
                <div class="stat-value small" id="lastScan">Never</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Next Auto-Scan</div>
                <div class="stat-value small" id="nextScan">—</div>
            </div>
        </div>

        <dialog class="history-panel history-dialog" id="historyDialog" aria-labelledby="historyTitle">
            <div class="dialog-body">
                <div class="dialog-head">
                    <div>
                        <div class="panel-title" id="historyTitle">Device History</div>
                        <div class="dialog-sub" id="historySub"></div>
                    </div>
                    <button type="button" class="dialog-close" id="historyClose" aria-label="Close">✕</button>
                </div>
                <div class="history-controls">
                    <div class="range-group" role="group" aria-label="Time range" id="historyRange">
                        <button type="button" data-range="6h">6h</button>
                        <button type="button" data-range="24h">24h</button>
                        <button type="button" data-range="7d">7d</button>
                        <button type="button" data-range="30d">30d</button>
                        <button type="button" data-range="90d">90d</button>
                        <button type="button" data-range="1y">1y</button>
                    </div>
                    <span class="history-status" id="historyStatus"></span>
                </div>
                <!-- Live state from the latest poll (Wi-Fi radios and clients), when a device has it -->
                <div class="live-panel" id="historyLive"></div>
                <!-- Cards are added by history.js for the data each device reports -->
                <div class="chart-grid" id="historyCharts"></div>
            </div>
        </dialog>

        <div class="panel">
            <div class="panel-hint">Click a device to see its CPU, temperature and disk history.</div>
            <div class="panel-title">Network Devices</div>

            <div class="loading" id="loading">
                <div id="progressBarContainer">
                    <div id="progressBarTrack"><div id="progressBar"></div></div>
                    <div id="progressText"></div>
                </div>
                <span id="loadingText">Scanning network...</span>
            </div>

            <div id="deviceTableContainer"></div>
            <div class="device-tree" id="deviceTree"></div>
        </div>
    </div>

    <script>
        // Theme toggle (mirrors Hub behaviour)
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
        });
    </script>
    <script>
        var staticBase = window.location.pathname.includes('/snmp') ? '/snmp/static/' : '/static/';
        ['app.js', 'history.js'].forEach(function (name) {
            var script = document.createElement('script');
            script.src = staticBase + name;
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
